<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Registration Portal</title>
    <script>
        // Inline Route Guard: Redirect back to login if session key is missing
        if (localStorage.getItem("portalSession") !== "authenticated") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-radius: 8px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; background: #eef2f3; padding: 20px; border-radius: 6px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.85em; color: #4a5568; }
        input, select { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 0.9em; }
        .full-width { grid-column: 1 / -1; display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        button { padding: 10px 24px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 0.95em; }
        .btn-submit { background-color: #28a745; color: white; }
        .btn-update { background-color: #007bff; color: white; display: none; }
        .btn-cancel { background-color: #6c757d; color: white; display: none; }
        .btn-logout { background-color: #e53e3e; color: white; padding: 6px 15px; font-size: 0.9em; }
        .table-responsive { overflow-x: auto; margin-top: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; text-align: left; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px 16px; white-space: nowrap; }
        th { background-color: #2d3748; color: white; }
        tr:nth-child(even) td { background-color: #f7fafc; }
        .action-btns button { padding: 4px 10px; margin: 0 2px; font-size: 0.85em; border-radius: 3px; }
        .btn-edit { background: #ecc94b; color: #744210; }
        .btn-delete { background: #e53e3e; color: white; }
        #loading { display: none; text-align: center; font-weight: bold; color: #2b6cb0; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Candidate Registry</h2>
        <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
    
    <input type="hidden" id="rowNumber">

    <form id="candidateForm">
        <div class="form-group"><label>Position ID.</label><input type="text" id="Position ID" required></div>
        <div class="form-group"><label>Role</label><input type="text" id="Role" required></div>
        <div class="form-group">
            <label>Candidate Status</label>
            <select id="Candidate Status">
                <option value="Applied">Applied</option>
                <option value="Interviewing">Interviewing</option>
                <option value="Offered">Offered</option>
                <option value="Joined">Joined</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>
        <div class="form-group"><label>Candidate Name</label><input type="text" id="Candidate Name" required></div>
        <div class="form-group"><label>Contact No</label><input type="text" id="Contact No" required></div>
        <div class="form-group"><label>Mail Id</label><input type="email" id="Mail Id" required></div>
        <div class="form-group"><label>Designation</label><input type="text" id="Designation"></div>
        <div class="form-group"><label>Department</label><input type="text" id="Department"></div>
        <div class="form-group"><label>Interview Date</label><input type="date" id="Interview Date"></div>
        <div class="form-group"><label>Offered Date</label><input type="date" id="Offered Date"></div>
        <div class="form-group"><label>Date of Joining</label><input type="date" id="Date of Joining"></div>
        <div class="form-group"><label>CTC</label><input type="number" id="CTC"></div>
        <div class="form-group"><label>Variable</label><input type="text" id="variable"></div>
        <div class="form-group"><label>Source</label><input type="text" id="Source"></div>
        <div class="form-group">
            <label>Offer Acceptance</label>
            <select id="Offer Acceptance">
                <option value="Pending">Pending</option>
                <option value="Accepted">Accepted</option>
                <option value="Declined">Declined</option>
            </select>
        </div>
        <div class="form-group" style="grid-column: span 2;"><label>Remarks</label><input type="text" id="Remarks"></div>

        <div class="full-width">
            <button type="button" class="btn-submit" id="submitBtn" onclick="saveRecord('create')">Register Candidate</button>
            <button type="button" class="btn-update" id="updateBtn" onclick="saveRecord('update')">Update Details</button>
            <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel</button>
        </div>
    </form>

    <div id="loading">Updating system data records...</div>

    <h3>Synchronized Candidate Workspace</h3>
    <div class="table-responsive">
        <table id="candidateTable">
            <thead>
                <tr>
                    <th>S.No</th><th>Position ID.</th><th>Role</th><th>Status</th><th>Candidate Name</th>
                    <th>Contact</th><th>Mail ID</th><th>Designation</th><th>Department</th>
                    <th>Interview Date</th><th>Offered Date</th><th>DOJ</th><th>CTC</th>
                    <th>Variable</th><th>Source</th><th>Acceptance</th><th>Remarks</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbwutmR5hRjb_sppUcI0FogNwqoruVYIM4k_JgAjBLxZ6gsBV0n58ozVApaSHSS-d1o0CQ/exec";
    const TARGET_TAB = "Candidate"; // Tells the script which operational sheet to target
    
    // Explicit array definitions matching Form field inputs and Google header values
    const fields = ["Position ID", "Role", "Candidate Status", "Candidate Name", "Contact No", "Mail Id", "Designation", "Department", "Interview Date", "Offered Date", "Date of Joining", "CTC", "variable", "Source", "Offer Acceptance", "Remarks"];
    let allData = [];

    window.onload = function() {
        fetchData();
    };

    function showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    function fetchData() {
        showLoading(true);
        fetch(`${API_URL}?action=read&sheetName=${encodeURIComponent(TARGET_TAB)}`, { method: "GET", redirect: "follow" })
        .then(res => res.json())
        .then(response => {
            if(response.status === "success") {
                allData = response.data;
                renderTable(allData);
            }
            showLoading(false);
        }).catch(err => { console.error(err); showLoading(false); });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        data.forEach(row => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row["S.no"] || ''}</td>
                <td>${row["Position ID."] || ''}</td>
                <td>${row["Role"] || ''}</td>
                <td>${row["Candidate Status"] || ''}</td>
                <td>${row["Candidate Name"] || ''}</td>
                <td>${row["Contact No"] || ''}</td>
                <td>${row["Mail Id"] || ''}</td>
                <td>${row["Designation"] || ''}</td>
                <td>${row["Department"] || ''}</td>
                <td>${row["Interview Date"] || ''}</td>
                <td>${row["Offered Date"] || ''}</td>
                <td>${row["Date of Joining"] || ''}</td>
                <td>${row["CTC"] || ''}</td>
                <td>${row["variable"] || ''}</td>
                <td>${row["Source"] || ''}</td>
                <td>${row["Offer Acceptance"] || ''}</td>
                <td>${row["Remarks"] || ''}</td>
                <td class="action-btns">
                    <button class="btn-edit" onclick="editRecord(${row.rowNumber})">Edit</button>
                    <button class="btn-delete" onclick="deleteRecord(${row.rowNumber})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function saveRecord(action) {
        showLoading(true);
        let targetUrl = `${API_URL}?action=${action}&sheetName=${encodeURIComponent(TARGET_TAB)}`;
        
        if(action === 'update') {
            targetUrl += `&rowNumber=${document.getElementById('rowNumber').value}`;
        }

        // Loop through schema fields dynamically to assemble URL strings safely
        fields.forEach(field => {
            const val = document.getElementById(field).value;
            targetUrl += `&${encodeURIComponent(field)}=${encodeURIComponent(val)}`;
        });

        fetch(targetUrl, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(res => {
            alert(res.message);
            resetForm();
            fetchData();
        }).catch(err => { console.error(err); showLoading(false); });
    }

    function editRecord(rowNumber) {
        const record = allData.find(r => r.rowNumber === rowNumber);
        if(!record) return;

        document.getElementById('rowNumber').value = rowNumber;
        fields.forEach(field => {
            document.getElementById(field).value = record[field] || '';
        });

        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'inline-block';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteRecord(rowNumber) {
        if(confirm("Confirm record deletion?")) {
            showLoading(true);
            fetch(`${API_URL}?action=delete&sheetName=${encodeURIComponent(TARGET_TAB)}&rowNumber=${rowNumber}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                alert(res.message);
                fetchData();
            }).catch(err => { console.error(err); showLoading(false); });
        }
    }

    function resetForm() {
        document.getElementById('candidateForm').reset();
        document.getElementById('rowNumber').value = '';
        document.getElementById('submitBtn').style.display = 'inline-block';
        document.getElementById('updateBtn').style.display = 'none';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function logout() {
        localStorage.removeItem("portalSession");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
